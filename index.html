<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>French A1 Quiz – Kiểm tra tiếng Pháp A1</title>
<style>
  :root{
    --bg:#eef5fd;
    --card:#ffffff;
    --primary:#4a86c8;
    --primary-dark:#35679e;
    --primary-soft:#e4effb;
    --border:#d8e7f7;
    --text:#22384f;
    --muted:#7690aa;
    --green:#2f9e6a;
    --green-soft:#e4f7ed;
    --red:#d9534f;
    --red-soft:#fdeceb;
    --amber:#c98a1b;
    --amber-soft:#fdf4e3;
    --radius:16px;
    --shadow:0 4px 18px rgba(74,134,200,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
    background-color:#eef5fd;
    background-image:
      radial-gradient(circle at 8% 0%, #e2eefc 0%, rgba(226,238,252,0) 45%),
      radial-gradient(circle at 92% 8%, #e7f1fd 0%, rgba(231,241,253,0) 42%);
    color:var(--text);
    min-height:100vh;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- HEADER ---------- */
  .app-header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.93);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:900px;margin:0 auto;padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .logo{font-size:26px;line-height:1;}
  .brand-text h1{font-size:17px;margin:0;color:var(--primary-dark);letter-spacing:.2px;}
  .brand-text span{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tabs{display:flex;gap:6px;flex-shrink:0;}
  .tab{
    border:1px solid var(--border);background:#fff;
    color:#5c7d9e;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;
    cursor:pointer;transition:.18s;font-family:inherit;
  }
  .tab:hover{background:var(--primary-soft);}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* ---------- LAYOUT ---------- */
  .container{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  .app-footer{
    text-align:center;color:var(--muted);font-size:12px;
    padding:18px 16px 30px;
  }

  /* ---------- HERO ---------- */
  .hero{
    background:linear-gradient(135deg,#f7fbff 0%,#e8f2fd 100%);
    border:1px solid var(--border);border-radius:var(--radius);
    padding:26px 22px;margin-bottom:20px;box-shadow:var(--shadow);
  }
  .hero h2{margin:0 0 6px;font-size:22px;color:var(--primary-dark);}
  .hero p{margin:0;color:#5b7893;font-size:14px;}
  .hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .hero-badges span{
    background:#fff;border:1px solid var(--border);border-radius:999px;
    padding:5px 12px;font-size:12px;color:#5c7d9e;font-weight:600;
  }

  /* ---------- RESUME BANNER ---------- */
  .resume{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--amber-soft);border:1px solid #f2dfb4;border-radius:var(--radius);
    padding:14px 18px;margin-bottom:20px;
  }
  .resume p{margin:0;font-size:13.5px;color:#8a6415;}
  .resume b{color:#7a5510;}

  /* ---------- MODE CARDS ---------- */
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
  .mode-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;
    transition:transform .18s, box-shadow .18s;
  }
  .mode-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(74,134,200,.16);}
  .mode-icon{font-size:28px;margin-bottom:8px;}
  .mode-card h3{margin:0 0 6px;font-size:16px;color:var(--primary-dark);}
  .mode-card p{margin:0 0 16px;font-size:13px;color:#69839c;flex:1;}
  .mode-card .btn{align-self:flex-start;}

  /* ---------- BUTTONS ---------- */
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;border-radius:12px;
    padding:10px 18px;cursor:pointer;border:1px solid transparent;transition:.18s;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
  .btn.ghost{background:#fff;color:#4a7aa8;border-color:var(--border);}
  .btn.ghost:hover{background:var(--primary-soft);}
  .btn.danger{background:#fff;color:var(--red);border-color:#f2c9c7;}
  .btn.danger:hover{background:var(--red-soft);}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;}
  .btn.small{font-size:12.5px;padding:7px 13px;border-radius:10px;}

  /* ---------- QUIZ ---------- */
  .quiz-top{margin-bottom:14px;}
  .quiz-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .pill{
    font-size:11.5px;font-weight:700;letter-spacing:.3px;
    background:var(--primary-soft);color:var(--primary-dark);
    border-radius:999px;padding:4px 11px;
  }
  .pill.part{background:#f0f6fd;color:#6d8aa6;}
  .quiz-counter{font-size:14px;color:#5c7d9e;margin-bottom:8px;}
  .quiz-counter b{color:var(--primary-dark);font-size:16px;}
  .progress{
    height:9px;background:#e2eefb;border-radius:999px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,#7fb2e5,#4a86c8);
    border-radius:999px;transition:width .3s ease;width:0;
  }
  .answered-label{font-size:12px;color:var(--muted);margin-top:6px;text-align:right;}

  .question-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);margin-bottom:16px;
  }
  .question-text{
    font-size:17px;font-weight:600;color:#1f3550;margin:0 0 18px;line-height:1.6;
    display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;
  }
  .question-text .qnum{
    background:var(--primary-soft);color:var(--primary-dark);border-radius:8px;
    padding:2px 10px;font-size:12px;font-weight:800;flex-shrink:0;margin-top:2px;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    background:#f8fbff;border:1.5px solid var(--border);border-radius:13px;
    padding:13px 15px;cursor:pointer;font-family:inherit;font-size:15px;
    color:var(--text);transition:.16s;line-height:1.5;
  }
  .option:hover:not(:disabled){border-color:#a9cdec;background:#f1f8ff;}
  .option.selected{
    border-color:var(--primary);background:var(--primary-soft);
    box-shadow:0 0 0 3px rgba(74,134,200,.12);
  }
  .option.correct{
    border-color:#8fd8b4;background:var(--green-soft);
  }
  .option.wrong{
    border-color:#f0b3b0;background:var(--red-soft);
  }
  .option:disabled{cursor:default;}
  .option-letter{
    flex-shrink:0;width:26px;height:26px;border-radius:8px;
    background:#e4effb;color:var(--primary-dark);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;
  }
  .option.selected .option-letter{background:var(--primary);color:#fff;}
  .option.correct .option-letter{background:var(--green);color:#fff;}
  .option.wrong .option-letter{background:var(--red);color:#fff;}
  .option-text{flex:1;padding-top:2px;}

  /* ---------- PASSAGE ---------- */
  .passage{
    background:#f7fbff;border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow);
  }
  .passage summary{
    cursor:pointer;padding:14px 18px;font-weight:700;font-size:13.5px;
    color:var(--primary-dark);list-style:none;user-select:none;
  }
  .passage summary::-webkit-details-marker{display:none;}
  .passage summary::after{content:"▾";float:right;color:var(--muted);}
  .passage[open] summary::after{content:"▴";}
  .passage-body{
    padding:0 18px 18px;font-size:14.5px;color:#33506d;line-height:1.75;
    border-top:1px solid var(--border);padding-top:14px;
  }
  .passage-body p{margin:0 0 10px;}

  .part-divider{
    display:flex;align-items:center;gap:12px;
    margin:22px 0 16px;color:var(--primary-dark);
  }
  .part-divider .line{flex:1;height:1px;background:var(--border);}
  .part-divider .label{
    font-size:13px;font-weight:800;letter-spacing:.3px;
    background:var(--primary-soft);border-radius:999px;padding:6px 14px;
  }

  /* ---------- FEEDBACK ---------- */
  .feedback{
    margin-top:16px;border-radius:13px;padding:14px 16px;font-size:14px;
    border:1px solid;
  }
  .feedback.ok{background:var(--green-soft);border-color:#b7e6cd;color:#1f7a51;}
  .feedback.no{background:var(--red-soft);border-color:#f4c8c5;color:#a53f3b;}
  .feedback strong{display:block;margin-bottom:6px;font-size:15px;}
  .feedback p{margin:4px 0;}

  /* ---------- ACTIONS ---------- */
  .quiz-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .quiz-actions .btn{flex:1;min-width:130px;}
  .quiz-actions.second{margin-top:10px;}

  /* ---------- RESULT ---------- */
  .result-hero{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px 22px;box-shadow:var(--shadow);margin-bottom:20px;
    display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center;
  }
  .score-circle{
    width:138px;height:138px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .score-circle::before{
    content:"";position:absolute;inset:11px;background:#fff;border-radius:50%;
  }
  .score-inner{position:relative;text-align:center;}
  .score-num{display:block;font-size:32px;font-weight:800;color:var(--primary-dark);line-height:1.1;}
  .score-den{display:block;font-size:12.5px;color:var(--muted);font-weight:600;}
  .result-stats{display:grid;grid-template-columns:repeat(2,minmax(96px,1fr));gap:10px;flex:1;min-width:220px;}
  .stat{
    border-radius:13px;padding:12px 14px;text-align:center;border:1px solid var(--border);
    background:#f8fbff;
  }
  .stat b{display:block;font-size:22px;line-height:1.2;}
  .stat span{font-size:12px;color:var(--muted);font-weight:600;}
  .stat.ok b{color:var(--green);}
  .stat.no b{color:var(--red);}
  .stat.na b{color:var(--amber);}
  .stat.pc b{color:var(--primary-dark);}

  .section-title{
    font-size:16px;color:var(--primary-dark);margin:26px 0 12px;font-weight:700;
  }

  .detail{
    background:var(--card);border:1px solid var(--border);border-left:5px solid var(--border);
    border-radius:13px;padding:16px 18px;margin-bottom:12px;
  }
  .detail.ok{border-left-color:#8fd8b4;}
  .detail.no{border-left-color:#f0b3b0;}
  .detail.na{border-left-color:#f0d9a8;}
  .detail-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .badge{
    background:var(--primary-soft);color:var(--primary-dark);border-radius:8px;
    padding:3px 10px;font-size:12px;font-weight:800;
  }
  .tag{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px;}
  .tag.ok{background:var(--green-soft);color:var(--green);}
  .tag.no{background:var(--red-soft);color:var(--red);}
  .tag.na{background:var(--amber-soft);color:var(--amber);}
  .detail-q{margin:0 0 10px;font-size:14.5px;font-weight:600;color:#1f3550;}
  .detail-line{margin:5px 0;font-size:13.5px;color:#4b6a87;}
  .detail-line .lbl{color:var(--muted);font-weight:600;}
  .detail-line b{color:#1f3550;}
  .exp{
    margin:10px 0 0;font-size:13px;color:#5c7d9e;background:#f6faff;
    border-radius:10px;padding:10px 12px;border:1px solid #e6f1fb;
  }

  /* ---------- REVIEW ---------- */
  .page-head{margin-bottom:18px;}
  .page-head h2{margin:0 0 5px;font-size:20px;color:var(--primary-dark);}
  .page-head p{margin:0;font-size:13.5px;color:var(--muted);}
  .review-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(74,134,200,.06);
  }
  .review-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .review-q{margin:0 0 12px;font-size:15px;font-weight:600;color:#1f3550;}
  .review-options{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
  .review-options li{
    display:flex;align-items:center;gap:10px;font-size:14px;color:#4b6a87;
    background:#f8fbff;border:1px solid var(--border);border-radius:11px;padding:9px 13px;
  }
  .review-options li.correct{
    background:var(--green-soft);border-color:#b7e6cd;color:#1f7a51;font-weight:700;
  }
  .review-options .check{margin-left:auto;color:var(--green);font-weight:800;}

  /* ---------- PROGRESS PAGE ---------- */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:8px;}
  .big-stat{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;text-align:center;box-shadow:var(--shadow);
  }
  .big-stat b{display:block;font-size:26px;color:var(--primary-dark);line-height:1.2;}
  .big-stat span{font-size:12.5px;color:var(--muted);font-weight:600;}

  .history-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;margin-bottom:9px;font-size:13.5px;flex-wrap:wrap;
  }
  .history-row .date{color:var(--muted);font-size:12.5px;}
  .history-row .score{font-weight:800;color:var(--primary-dark);font-size:15px;}

  .wrong-item{
    background:var(--card);border:1px solid var(--border);border-left:5px solid #f0b3b0;
    border-radius:12px;padding:14px 16px;margin-bottom:10px;
  }
  .wrong-item .q{font-size:14px;font-weight:600;margin:0 0 6px;color:#1f3550;}
  .wrong-item .meta{font-size:12.5px;color:var(--muted);}
  .wrong-item .meta b{color:var(--green);}

  .empty{
    background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);
    padding:32px 20px;text-align:center;color:var(--muted);font-size:14px;
  }

  .page-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}

  @media (max-width:560px){
    .brand-text span{display:none;}
    .hero h2{font-size:19px;}
    .question-text{font-size:16px;}
    .option{font-size:14.5px;padding:12px 13px;}
    .result-hero{gap:18px;}
    .score-circle{width:118px;height:118px;}
    .score-num{font-size:27px;}
    .result-stats{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">🇫🇷</div>
      <div class="brand-text">
        <h1>French A1 Quiz</h1>
        <span>Grammaire · Vocabulaire · Compréhension écrite</span>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="home">Trang chủ</button>
      <button class="tab" data-view="progress">Thống kê</button>
    </nav>
  </div>
</header>

<main class="container" id="app"></main>

<footer class="app-footer">
  French A1 Quiz · 28 câu hỏi · Bonne chance ! 🍀
</footer>

<script>
/* ============================================================
   1. DỮ LIỆU ĐỀ THI (28 CÂU – NGUYÊN BẢN)
   ============================================================ */

const READING_HTML = `
  <p><strong>Vũng Tàu – une belle ville au bord de la mer</strong></p>
  <p>Vũng Tàu est une belle ville du sud du Vietnam. Elle est au bord de la mer. C’est une destination très connue pour les touristes. À Vũng Tàu, il y a de belles plages. Les touristes aiment se promener au bord de la mer, se baigner et regarder le coucher du soleil.</p>
  <p>La ville possède aussi plusieurs lieux historiques. On peut visiter un musée pour découvrir l’histoire de Vũng Tàu. Un monument intéressant est la tour Tam Thắng. Elle est située près de la mer. Elle est un symbole de la ville.</p>
  <p>On peut aussi visiter le Palais Blanc. C’est un ancien bâtiment construit sur la montagne Tao Phùng. À l’époque coloniale, le gouverneur général Paul Doumer y a séjourné. Aujourd’hui, le Palais Blanc est un lieu historique et touristique.</p>
  <p>Vũng Tàu est donc une ville intéressante. On peut y découvrir la mer, les plages, les montagnes, les musées et les monuments historiques. C’est une belle destination pour un voyage au Vietnam.</p>
`;

const QUESTIONS = [
  /* ---------- PARTIE I : GRAMMAIRE ET VOCABULAIRE (1–21) ---------- */
  {
    id: 1, part: 1,
    question: "J’aime bien ____ petit village de montagne.",
    options: ["cette", "ce", "cet", "ces"],
    correct: 1,
    explanation: "« village » là danh từ giống đực số ít nên dùng « ce ». « cette » dùng cho giống cái số ít, « cet » cho giống đực số ít bắt đầu bằng nguyên âm, « ces » dùng cho số nhiều."
  },
  {
    id: 2, part: 1,
    question: "Qu’est-ce que « sdb » veut dire ?",
    options: ["chambre", "park", "salle de bains", "étage"],
    correct: 2,
    explanation: "« sdb » là viết tắt của « salle de bains », nghĩa là phòng tắm."
  },
  {
    id: 3, part: 1,
    question: "Allez jusqu’… pont, traversez et continuez jusqu’… opéra.",
    options: ["au / à la", "à la / à l’", "au / à l’", "à la / au"],
    correct: 2,
    explanation: "« pont » là danh từ giống đực số ít → au pont. « opéra » bắt đầu bằng nguyên âm → à l’opéra."
  },
  {
    id: 4, part: 1,
    question: "Écrivez une question et une réponse correctes : « Vous-aller-école-rollers »",
    options: [
      "Vous allez à l’école comment ? — J’y vais en rollers.",
      "Vous aller à l’école comment ? — J’y vais en rollers.",
      "Vous allez à l’école comment ? — J’y vais à rollers.",
      "Vous allez l’école comment ? — J’y vais en rollers."
    ],
    correct: 0,
    explanation: "« vous allez » là cách chia đúng của động từ aller với vous. Trước « école » phải có giới từ: à l’école. Phương tiện đi lại dùng « en rollers » (en + phương tiện)."
  },
  {
    id: 5, part: 1,
    question: "C’est un restaurant avec l’air conditionné.",
    options: [
      "Ce restaurant est l’air conditionné.",
      "Cette restaurant a l’air conditionné.",
      "Ce restaurant a l’air conditionné.",
      "Ce restaurant ont l’air conditionné."
    ],
    correct: 2,
    explanation: "« restaurant » là danh từ giống đực số ít → « ce restaurant ». Động từ avoir với chủ ngữ số ít → « a ». Cấu trúc: avoir l’air conditionné (có máy lạnh)."
  },
  {
    id: 6, part: 1,
    question: "Ces chaussures coûtent ____, s’il vous plaît ?",
    options: ["Comment", "Combien", "Quels", "Quelles"],
    correct: 1,
    explanation: "« Combien » dùng để hỏi giá tiền hoặc số lượng: Ça coûte combien ?"
  },
  {
    id: 7, part: 1,
    question: "Tu passes à la poste ?",
    options: [
      "Oui, j’y passe.",
      "Oui, tu y passes.",
      "Oui, je y passe.",
      "Oui, t’y passes."
    ],
    correct: 0,
    explanation: "« y » thay thế cho « à la poste ». Với chủ ngữ « je », động từ passer chia là « passe » → j’y passe."
  },
  {
    id: 8, part: 1,
    question: "Ma mère habite avec ma femme et moi.",
    options: [
      "Ma mère habite avec elle.",
      "Ma mère habite avec eux.",
      "Ma mère habite avec nous.",
      "Ma mère habite avec elles."
    ],
    correct: 2,
    explanation: "« nous » thay thế cho « ma femme et moi » (vợ tôi và tôi) — tức là ngôi thứ nhất số nhiều."
  },
  {
    id: 9, part: 1,
    question: "Comment est-ce que tu vas à la poste ?",
    options: [
      "J’y vais à vélo.",
      "Il y va à vélo.",
      "Elle y va à vélo.",
      "Tu y vas à vélo."

/* ============================================================
   2. TIỆN ÍCH & LƯU TRỮ
   ============================================================ */

const QMAP = {};
QUESTIONS.forEach(function (q) { QMAP[q.id] = q; });
const TOTAL = QUESTIONS.length; // 28

const LS = {
  HISTORY: "fa1_history_v1",
  WRONG: "fa1_wrong_v1",
  SESSION: "fa1_session_v2",   /* v2: cấu trúc phiên bản mới (chia part1/part2) */
  RESULT: "fa1_result_v1"
};

function load(key, def) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : def;
  } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function remove(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function getQuestion(id) { return QMAP[id]; }
function formatDate(iso) {
  try {
    const d = new Date(iso);
    const p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() +
           " " + p(d.getHours()) + ":" + p(d.getMinutes());
  } catch (e) { return iso; }
}

/* ============================================================
   3. TRẠNG THÁI
   ============================================================ */

let session = null;
let lastResult = null;
let view = "home";

const app = document.getElementById("app");

/* ============================================================
   4. KHỞI TẠO
   ============================================================ */

function init() {
  session = load(LS.SESSION, null);
  lastResult = load(LS.RESULT, null);
  if (session && session.submitted) session = null;
  if (session && (!session.part1 || !session.part2)) session = null; // không tương thích cũ

  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () { showView(tab.dataset.view); });
  });

  app.addEventListener("click", handleClick);

  render();
}

function showView(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(function (t) {
    t.classList.toggle("active", t.dataset.view === v);
  });
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  if (view === "home") renderHome();
  else if (view === "quiz") renderQuiz();
  else if (view === "result") renderResult();
  else if (view === "review") renderReview();
  else if (view === "progress") renderProgress();
}

/* ============================================================
   5. XỬ LÝ SỰ KIỆN
   ============================================================ */

function handleClick(e) {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  switch (action) {
    case "start-full":      startTest(false); break;
    case "start-random":    startTest(true); break;
    case "start-practice":  startPractice(); break;
    case "review":          showView("review"); break;
    case "resume":          showView("quiz"); break;
    case "discard":         discardSession(); break;
    case "select":          selectOption(Number(btn.dataset.qid), Number(btn.dataset.orig)); break;
    case "prev":            navigate(-1); break;
    case "next":            navigate(1); break;
    case "back-to-part1":   goToPart1(); break;
    case "submit":          submitTest(); break;
    case "check":           checkAnswer(Number(btn.dataset.qid)); break;
    case "home":            showView("home"); break;
    case "progress":        showView("progress"); break;
    case "clear-data":      clearData(); break;
  }
}

/* ============================================================
   6. XÂY DỰNG PHIÊN LÀM BÀI
   ============================================================ */

function makeItem(q, shuffleOptions) {
  const order = q.options.map(function (_, i) { return i; });
  return {
    qid: q.id,
    order: shuffleOptions ? shuffle(order) : order
  };
}

function buildSession(mode) {
  const part1Src = QUESTIONS.filter(function (q) { return q.part === 1; });
  const part2Src = QUESTIONS.filter(function (q) { return q.part === 2; });

  const doShuffle = (mode === "random");
  let part1 = part1Src.map(function (q) { return makeItem(q, doShuffle); });
  let part2 = part2Src.map(function (q) { return makeItem(q, doShuffle); });

  if (doShuffle) {
    part1 = shuffle(part1);
    part2 = shuffle(part2);
  }

  return {
    mode: mode,
    part1: part1,
    part2: part2,
    answers: {},
    checked: {},
    currentPart: 1,
    currentIndex: 0,
    submitted: false,
    startedAt: new Date().toISOString()
  };
}

function confirmOverwrite() {
  if (session && !session.submitted) {
    return confirm("Bạn đang có một bài làm dở. Bắt đầu bài mới sẽ xóa bài cũ.\nBạn có muốn tiếp tục?");
  }
  return true;
}

function startTest(isRandom) {
  if (!confirmOverwrite()) return;
  session = buildSession(isRandom ? "random" : "full");
  save(LS.SESSION, session);
  showView("quiz");
}

function startPractice() {
  if (!confirmOverwrite()) return;
  session = buildSession("practice");
  save(LS.SESSION, session);
  showView("quiz");
}

function discardSession() {
  if (!confirm("Xóa bài làm dở và bắt đầu lại từ đầu?")) return;
  session = null;
  remove(LS.SESSION);
  render();
}

/* Đếm số câu đã trả lời */
function countAnswered() {
  if (!session) return 0;
  let n = 0;
  session.part1.concat(session.part2).forEach(function (it) {
    if (session.answers[it.qid] !== undefined) n++;
  });
  return n;
}

/* ---------- Phần I: 1 câu / lần ---------- */

function renderPart1Question(isPractice) {
  const item = session.part1[session.currentIndex];
  const q = getQuestion(item.qid);
  const isChecked = !!(isPractice && session.checked[q.id]);
  const chosen = session.answers[q.id];

  let html = '<div class="question-card" data-question-id="' + q.id + '">' +
    '<p class="question-text">' + esc(q.question) + "</p>" +
    '<div class="options">';

  item.order.forEach(function (origIdx, pos) {
    let cls = "option";
    if (chosen === origIdx) cls += " selected";
    if (isChecked) {
      if (origIdx === q.correct) cls += " correct";
      else if (chosen === origIdx) cls += " wrong";
    }
    html += '<button class="' + cls + '" data-action="select" data-qid="' + q.id +
      '" data-orig="' + origIdx + '"' + (isChecked ? " disabled" : "") + ">" +
      '<span class="option-letter">' + LETTERS[pos] + "</span>" +
      '<span class="option-text">' + esc(q.options[origIdx]) + "</span>" +
    "</button>";
  });

  html += "</div>";

  if (isChecked) {
    const ok = chosen === q.correct;
    html += '<div class="feedback ' + (ok ? "ok" : "no") + '">' +
      "<strong>" + (ok ? "✅ Chính xác !" : "❌ Chưa đúng") + "</strong>" +
      "<p>Đáp án đúng: <b>" + esc(q.options[q.correct]) + "</b></p>" +
      "<p>💡 " + esc(q.explanation) + "</p>" +
    "</div>";
  }

  html += "</div>"; // .question-card

  const isLast = session.currentIndex === session.part1.length - 1;
  const canCheck = chosen !== undefined && !isChecked;

  if (isPractice) {
    html += '<div class="quiz-actions">' +
      '<button class="btn ghost" data-action="prev"' + (session.currentIndex === 0 ? " disabled" : "") + ">← Câu trước</button>" +
      '<button class="btn primary" data-action="check" data-qid="' + q.id + '"' + (canCheck ? "" : " disabled") + ">✔ Kiểm tra đáp án</button>" +
      '<button class="btn ghost" data-action="next">Câu tiếp theo →</button>' +
    "</div>";
  } else {
    html += '<div class="quiz-actions">' +
      '<button class="btn ghost" data-action="prev"' + (session.currentIndex === 0 ? " disabled" : "") + ">← Câu trước</button>" +
      '<button class="btn primary" data-action="next">' + (isLast ? "Sang phần II →" : "Câu tiếp theo →") + "</button>" +
    "</div>";
  }

  return html;
}

      '<p class="question-text">' +
        '<span class="qnum">Câu ' + q.id + "</span>" +
        "<span>" + esc(q.question) + "</span>" +
      "</p>" +
      '<div class="options">';

    item.order.forEach(function (origIdx, pos) {
      let cls = "option";
      if (chosen === origIdx) cls += " selected";
      if (isChecked) {
        if (origIdx === q.correct) cls += " correct";
        else if (chosen === origIdx) cls += " wrong";
      }
      html += '<button class="' + cls + '" data-action="select" data-qid="' + q.id +
        '" data-orig="' + origIdx + '"' + (isChecked ? " disabled" : "") + ">" +
        '<span class="option-letter">' + LETTERS[pos] + "</span>" +
        '<span class="option-text">' + esc(q.options[origIdx]) + "</span>" +
      "</button>";
    });

    html += "</div>"; // .options

    if (isPractice && !isChecked) {
      html += '<div style="margin-top:14px;display:flex;justify-content:flex-end;">' +
        '<button class="btn primary small" data-action="check" data-qid="' + q.id + '"' +
          (chosen === undefined ? " disabled" : "") + ">✔ Kiểm tra đáp án</button>" +
      "</div>";
    }

    if (isChecked) {
      const ok = chosen === q.correct;
      html += '<div class="feedback ' + (ok ? "ok" : "no") + '">' +
        "<strong>" + (ok ? "✅ Chính xác !" : "❌ Chưa đúng") + "</strong>" +
        "<p>Đáp án đúng: <b>" + esc(q.options[q.correct]) + "</b></p>" +
        "<p>💡 " + esc(q.explanation) + "</p>" +
      "</div>";
    }

    html += "</div>"; // .question-card
  });

  // Nút điều hướng cho phần II
  if (isPractice) {
    html += '<div class="quiz-actions">' +
      '<button class="btn ghost" data-action="back-to-part1">← Quay lại phần I</button>' +
      '<button class="btn primary" data-action="home">🏠 Về trang chủ</button>' +
    "</div>";
  } else {
    html += '<div class="quiz-actions">' +
      '<button class="btn ghost" data-action="back-to-part1">← Quay lại phần I</button>' +
    "</div>" +
    '<div class="quiz-actions second">' +
      '<button class="btn primary block" data-action="submit">📩 Nộp bài</button>' +
    "</div>";
  }

  return html;
}

/* ---------- Chọn đáp án ---------- */

function selectOption(qid, origIdx) {
  if (!session) return;
  if (session.mode === "practice" && session.checked && session.checked[qid]) return;

  session.answers[qid] = origIdx;
  save(LS.SESSION, session);

  // Cập nhật DOM cho các nút của câu hỏi này
  document.querySelectorAll('[data-action="select"][data-qid="' + qid + '"]').forEach(function (el) {
    el.classList.toggle("selected", Number(el.dataset.orig) === origIdx);
  });

  // Mở khóa nút Kiểm tra (chế độ luyện tập)
  const checkBtn = document.querySelector('[data-action="check"][data-qid="' + qid + '"]');
  if (checkBtn) checkBtn.disabled = false;

  updateProgressUI();
}

function updateProgressUI() {
  if (!session) return;
  const answered = countAnswered();
  const fill = document.getElementById("progressFill");
  const label = document.getElementById("answeredLabel");
  if (fill) fill.style.width = (answered / TOTAL * 100) + "%";
  if (label) label.innerHTML = "Đã trả lời: <b>" + answered + "</b> / " + TOTAL;
}

/* ---------- Kiểm tra đáp án (chỉ chế độ luyện tập) ---------- */

function checkAnswer(qid) {
  if (!session || session.mode !== "practice") return;
  const q = getQuestion(qid);
  const chosen = session.answers[qid];
  if (chosen === undefined) return;
  if (session.checked[qid]) return;

  session.checked[qid] = true;
  save(LS.SESSION, session);

  recordAnswer(qid, chosen === q.correct);

  // Ghi nhớ vị trí để tránh nhảy trang
  const prevScroll = window.scrollY;
  renderQuiz();

  // Cố gắng cuộn tới câu vừa kiểm tra (nếu là phần II)
  const el = document.querySelector('[data-question-id="' + qid + '"]');
  if (el && session.currentPart === 2) {
    requestAnimationFrame(function () {
      const rect = el.getBoundingClientRect();
      window.scrollBy({ top: rect.top - 80, behavior: "auto" });
    });
  } else {
    window.scrollTo({ top: prevScroll, behavior: "auto" });
  }
}

/* ---------- Điều hướng phần I ---------- */

function navigate(dir) {
  if (!session) return;
  if (session.currentPart !== 1) return;

  if (dir === 1 && session.currentIndex === session.part1.length - 1) {
    // Sang phần II
    session.currentPart = 2;
    save(LS.SESSION, session);
    renderQuiz();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  const target = session.currentIndex + dir;
  if (target < 0 || target >= session.part1.length) return;

  session.currentIndex = target;
  save(LS.SESSION, session);
  renderQuiz();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goToPart1() {
  if (!session) return;
  session.currentPart = 1;
  // Đặt lại về câu cuối phần I
  session.currentIndex = session.part1.length - 1;
  save(LS.SESSION, session);
  renderQuiz();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- Ghi nhận đáp án (thống kê) ---------- */

function recordAnswer(qid, isCorrect) {
  const stats = load(LS.WRONG, {});
  const s = stats[qid] || { attempts: 0, wrong: 0 };
  s.attempts += 1;
  if (!isCorrect) s.wrong += 1;
  stats[qid] = s;
  save(LS.WRONG, stats);
}

function recordAnswerBatch(list) {
  const stats = load(LS.WRONG, {});
  list.forEach(function (entry) {
    const s = stats[entry.qid] || { attempts: 0, wrong: 0 };
    s.attempts += 1;
    if (!entry.isCorrect) s.wrong += 1;
    stats[entry.qid] = s;
  });
  save(LS.WRONG, stats);
}

/* ---------- Nộp bài ---------- */

function submitTest() {
  if (!session || session.mode === "practice") return;

  const allItems = session.part1.concat(session.part2);
  const unanswered = allItems.filter(function (it) {
    return session.answers[it.qid] === undefined;
  }).length;

  if (unanswered > 0) {
    const ok = confirm("⚠️ Bạn còn " + unanswered + " câu chưa trả lời.\nBạn vẫn muốn nộp bài chứ?");
    if (!ok) return;
  }

  const details = allItems.map(function (it) {
    const q = getQuestion(it.qid);
    const ans = session.answers[q.id];
    const isAnswered = ans !== undefined;
    const isCorrect = isAnswered && ans === q.correct;
    return {
      qid: q.id,
      answered: isAnswered,
      chosen: isAnswered ? ans : null,
      correct: q.correct,
      isCorrect: isCorrect
    };
  });

  const correctCount = details.filter(function (d) { return d.isCorrect; }).length;
  const answeredCount = details.filter(function (d) { return d.answered; }).length;
  const wrongCount = answeredCount - correctCount;
  const unansweredCount = TOTAL - answeredCount;

  const score = Math.round((correctCount / TOTAL) * 10 * 100) / 100;
  const percent = Math.round((correctCount / TOTAL) * 1000) / 10;

  const result = {
    date: new Date().toISOString(),
    mode: session.mode,
    total: TOTAL,
    correct: correctCount,
    wrong: wrongCount,
    unanswered: unansweredCount,
    score: score,
    percent: percent,
    details: details
  };

  const history = load(LS.HISTORY, []);
  history.push({
    date: result.date,
    mode: result.mode,
    score: score,
    correct: correctCount,
    wrong: wrongCount,
    unanswered: unansweredCount,
    percent: percent
  });
  save(LS.HISTORY, history);

  recordAnswerBatch(details.filter(function (d) { return d.answered; }).map(function (d) {
    return { qid: d.qid, isCorrect: d.isCorrect };
  }));

  save(LS.RESULT, result);
  lastResult = result;

  session = null;
  remove(LS.SESSION);

  showView("result");
}

/* ============================================================
   9. MÀN HÌNH KẾT QUẢ
   ============================================================ */

function renderResult() {
  if (!lastResult) { showView("home"); return; }
  const r = lastResult;

  const modeLabel =
    r.mode === "full" ? "Làm toàn bộ đề" :
    r.mode === "random" ? "Đề ngẫu nhiên" : "Bài kiểm tra";

  let html = '<div class="page-head">' +
    "<h2>📊 Kết quả bài làm</h2>" +
    "<p>" + modeLabel + " · " + formatDate(r.date) + "</p>" +
  "</div>";

  html += '<div class="result-hero">' +
    '<div class="score-circle" style="background:conic-gradient(#4a86c8 ' + r.percent + '%, #e2eefb ' + r.percent + '% 100%)">' +
      '<div class="score-inner">' +
        '<span class="score-num">' + r.score.toFixed(2) + "</span>" +
        '<span class="score-den">/ 10 điểm</span>' +
      "</div>" +
    "</div>" +
    '<div class="result-stats">' +
      '<div class="stat ok"><b>' + r.correct + "</b><span>Câu đúng</span></div>" +
      '<div class="stat no"><b>' + r.wrong + "</b><span>Câu sai</span></div>" +
      '<div class="stat na"><b>' + r.unanswered + "</b><span>Chưa trả lời</span></div>" +
      '<div class="stat pc"><b>' + r.percent + "%</b><span>Độ chính xác</span></div>" +
    "</div>" +
  "</div>";

  html += '<div class="page-actions">' +
    '<button class="btn primary" data-action="home">🏠 Về trang chủ</button>' +
    '<button class="btn ghost" data-action="progress">📈 Xem thống kê</button>' +
    '<button class="btn ghost" data-action="review">📚 Xem lại đáp án</button>' +
  "</div>";

  html += '<h3 class="section-title">Chi tiết từng câu</h3>';

  r.details.forEach(function (d) {
    const q = getQuestion(d.qid);
    let cls = "detail ";
    let tagCls, tagText;
    if (!d.answered) { cls += "na"; tagCls = "na"; tagText = "Chưa trả lời"; }
    else if (d.isCorrect) { cls += "ok"; tagCls = "ok"; tagText = "Đúng"; }
    else { cls += "no"; tagCls = "no"; tagText = "Sai"; }

    const userAnswer = d.answered
      ? esc(q.options[d.chosen])
      : "<i>(không trả lời)</i>";

    html += '<div class="' + cls + '">' +
      '<div class="detail-head">' +
        '<span class="badge">Câu ' + q.id + "</span>" +
        '<span class="pill part">' + (q.part === 1 ? "Partie I" : "Partie II") + "</span>" +
        '<span class="tag ' + tagCls + '">' + tagText + "</span>" +
      "</div>" +
      '<p class="detail-q">' + esc(q.question) + "</p>" +
      '<p class="detail-line"><span class="lbl">Bạn chọn:</span> ' + userAnswer + "</p>" +
      '<p class="detail-line"><span class="lbl">Đáp án đúng:</span> <b>' + esc(q.options[q.correct]) + "</b></p>" +
      '<p class="exp">💡 ' + esc(q.explanation) + "</p>" +
    "</div>";
  });

  app.innerHTML = html;
}

/* ============================================================
   10. MÀN HÌNH XEM LẠI TOÀN BỘ
   ============================================================ */

function renderReview() {
  let html = '<div class="page-head">' +
    "<h2>📚 Xem lại toàn bộ câu hỏi</h2>" +
    "<p>28 câu hỏi kèm đáp án đúng và giải thích ngắn gọn bằng tiếng Việt.</p>" +
  "</div>";

  // Phần I
  const part1 = QUESTIONS.filter(function (q) { return q.part === 1; });
  const part2 = QUESTIONS.filter(function (q) { return q.part === 2; });

  html += '<div class="part-divider">' +
    '<span class="line"></span>' +
    '<span class="label">Partie I · Grammaire &amp; Vocabulaire</span>' +
    '<span class="line"></span>' +
  "</div>";

  part1.forEach(function (q) {
    html += renderReviewCard(q);
  });

  // Phần II
  html += '<div class="part-divider">' +
    '<span class="line"></span>' +
    '<span class="label">Partie II · Compréhension écrite</span>' +
    '<span class="line"></span>' +
  "</div>";

  html += '<details class="passage" open>' +
    "<summary>📖 Texte : Vũng Tàu – une belle ville au bord de la mer</summary>" +
    '<div class="passage-body">' + READING_HTML + "</div>" +
  "</details>";

  part2.forEach(function (q) {
    html += renderReviewCard(q);
  });

  html += '<div class="page-actions">' +
    '<button class="btn primary" data-action="home">🏠 Về trang chủ</button>' +
  "</div>";

  app.innerHTML = html;
}

function renderReviewCard(q) {
  let html = '<div class="review-card">' +
    '<div class="review-head">' +
      '<span class="badge">Câu ' + q.id + "</span>" +
      '<span class="pill part">' + (q.part === 1 ? "Partie I" : "Partie II") + "</span>" +
    "</div>" +
    '<p class="review-q">' + esc(q.question) + "</p>" +
    '<ul class="review-options">';

  q.options.forEach(function (opt, i) {
    html += '<li class="' + (i === q.correct ? "correct" : "") + '">' +
      '<span class="option-letter">' + LETTERS[i] + "</span>" +
      "<span>" + esc(opt) + "</span>" +
      (i === q.correct ? '<span class="check">✔</span>' : "") +
    "</li>";
  });

  html += "</ul>" +
    '<p class="exp">💡 ' + esc(q.explanation) + "</p>" +
  "</div>";

  return html;
}

/* ============================================================
   11. MÀN HÌNH THỐNG KÊ
   ============================================================ */

function renderProgress() {
  const history = load(LS.HISTORY, []);
  const stats = load(LS.WRONG, {});

  const totalAttempts = history.length;
  const best = totalAttempts ? Math.max.apply(null, history.map(function (h) { return h.score; })) : null;
  const avg = totalAttempts
    ? history.reduce(function (s, h) { return s + h.score; }, 0) / totalAttempts
    : null;

  let totalDone = 0;
  Object.keys(stats).forEach(function (k) { totalDone += stats[k].attempts; });

  let html = '<div class="page-head">' +
    "<h2>📈 Thống kê &amp; tiến độ</h2>" +
    "<p>Dữ liệu được lưu tự động trong trình duyệt của bạn (localStorage).</p>" +
  "</div>";

  html += '<div class="stats-grid">' +
    '<div class="big-stat"><b>' + totalAttempts + "</b><span>Số lần làm bài</span></div>" +
    '<div class="big-stat"><b>' + (best === null ? "—" : best.toFixed(2)) + "</b><span>Điểm cao nhất</span></div>" +
    '<div class="big-stat"><b>' + (avg === null ? "—" : avg.toFixed(2)) + "</b><span>Điểm trung bình</span></div>" +
    '<div class="big-stat"><b>' + totalDone + "</b><span>Tổng câu đã làm</span></div>" +
  "</div>";

  html += '<h3 class="section-title">⚠️ Những câu bạn thường trả lời sai</h3>';

  const wrongList = Object.keys(stats)
    .map(function (k) { return { qid: Number(k), data: stats[k] }; })
    .filter(function (x) { return x.data.wrong > 0; })
    .sort(function (a, b) { return b.data.wrong - a.data.wrong; })
    .slice(0, 8);

  if (wrongList.length === 0) {
    html += '<div class="empty">Chưa có dữ liệu câu sai. Hãy làm bài để hệ thống ghi nhận nhé! 🌱</div>';
  } else {
    wrongList.forEach(function (x) {
      const q = getQuestion(x.qid);
      if (!q) return;
      html += '<div class="wrong-item">' +
        '<p class="q">Câu ' + q.id + " : " + esc(q.question) + "</p>" +
        '<p class="meta">Sai <b>' + x.data.wrong + "</b> / " + x.data.attempts + " lần · " +
          "Đáp án đúng: <b>" + esc(q.options[q.correct]) + "</b></p>" +
      "</div>";
    });
  }

  html += '<h3 class="section-title">🕘 Lịch sử làm bài</h3>';

  if (history.length === 0) {
    html += '<div class="empty">Chưa có lần làm bài nào được lưu.</div>';
  } else {
    const recent = history.slice().reverse().slice(0, 10);
    recent.forEach(function (h) {
      const modeLabel =
        h.mode === "full" ? "📝 Toàn bộ đề" :
        h.mode === "random" ? "🔀 Ngẫu nhiên" : "Bài kiểm tra";
      html += '<div class="history-row">' +
        "<span>" + modeLabel + ' <span class="date">· ' + formatDate(h.date) + "</span></span>" +
        '<span><span class="score">' + h.score.toFixed(2) + "/10</span> " +
        '<span class="date">(' + h.correct + " đúng · " + h.wrong + " sai · " + h.unanswered + " bỏ trống)</span></span>" +
      "</div>";
    });
  }

  html += '<div class="page-actions">' +
    '<button class="btn primary" data-action="home">🏠 Về trang chủ</button>' +
    '<button class="btn danger" data-action="clear-data">🗑 Xóa toàn bộ dữ liệu</button>' +
  "</div>";

  app.innerHTML = html;
}

function clearData() {
  if (!confirm("Bạn có chắc muốn xóa toàn bộ lịch sử làm bài, thống kê và tiến độ?")) return;
  remove(LS.HISTORY);
  remove(LS.WRONG);
  remove(LS.SESSION);
  remove(LS.RESULT);
  session = null;
  lastResult = null;
  render();
}

/* ============================================================
   12. CHẠY ỨNG DỤNG
   ============================================================ */

init();
</script>
